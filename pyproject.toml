[tool.poetry]
name = "astro-bookings-demo"
version = "0.1.0"
description = "A bare-bones Python application for AstroBookings."
authors = ["Maren Calleja"]
readme = "README.md"
packages = [{ include = "astro_bookings", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
pydantic = "^2.13.5"
uvicorn = { extras = ["standard"], version = "^0.52.4" }

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
pytest = "^8.3.4"
ruff = "^0.8.4"

[tool.poetry.scripts]
astro-bookings = "astro_bookings.app:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
